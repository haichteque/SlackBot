{
    "display_information": {
        "name": "Expert Co-Pilot",
        "description": "An intelligent agent that surfaces the right people to solve your problem.",
        "background_color": "#2c2d30"
    },
    "features": {
        "bot_user": {
            "display_name": "Matchmaker",
            "always_online": true
        }
    },
    "oauth_config": {
        "scopes": {
            "bot": [
                "app_mentions:read",
                "chat:write",
                "im:history",
                "im:read",
                "im:write"
            ]
        },
        "pkce_enabled": true
    },
    "settings": {
        "event_subscriptions": {
            "bot_events": [
                "app_mention",
                "message.im"
            ]
        },
        "interactivity": {
            "is_enabled": true
        },
        "org_deploy_enabled": false,
        "socket_mode_enabled": true,
        "token_rotation_enabled": false,
        "is_mcp_enabled": false
    }
}